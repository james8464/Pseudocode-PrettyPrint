[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudocode-prettyprint"
dynamic = ["version"]
description = "Convert Cambridge-style pseudocode to syntax-highlighted RTF."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["pseudocode", "rtf", "syntax-highlighting", "cambridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pseudocode-prettyprint = "pseudocode_prettyprint.cli:main"

[project.urls]
Repository = "https://github.com/james8464/Pseudocode-PrettyPrint"

[tool.setuptools]
packages = ["pseudocode_prettyprint"]

[tool.setuptools.dynamic]
version = {attr = "pseudocode_prettyprint.__version__"}

[tool.setuptools.package-data]
pseudocode_prettyprint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
